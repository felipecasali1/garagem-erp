name: garagem-erp

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${GARAGEM_LOCAL_DB_PASSWORD:-}
      POSTGRES_PASSWORD: ${GARAGEM_LOCAL_DB_PASSWORD:-}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    volumes:
      - ./compose/supabase/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro,z
      - ./compose/supabase/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro,z
      - garagem-erp-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:${GARAGEM_LOCAL_API_PORT:-8000}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${GARAGEM_LOCAL_DB_PASSWORD:-}@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:${GARAGEM_LOCAL_APP_PORT:-3101}
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:${GARAGEM_LOCAL_APP_PORT:-3101}/**
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${GARAGEM_LOCAL_JWT_SECRET:-}
      GOTRUE_JWT_ISSUER: http://127.0.0.1:${GARAGEM_LOCAL_API_PORT:-8000}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: garagem-erp@localhost
      GOTRUE_SMTP_HOST: localhost
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_SENDER_NAME: GaragemERP
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_SMS_AUTOCONFIRM: "false"
    healthcheck:
      test: [CMD, wget, --no-verbose, --tries=1, --spider, http://127.0.0.1:9999/health]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]

  rest:
    image: postgrest/postgrest:v14.18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${GARAGEM_LOCAL_DB_PASSWORD:-}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: ${GARAGEM_LOCAL_JWT_SECRET:-}
      PGRST_APP_SETTINGS_JWT_EXP: 3600
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [backend]

  meta:
    image: public.ecr.aws/supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${GARAGEM_LOCAL_DB_PASSWORD:-}
      CRYPTO_KEY: ${GARAGEM_LOCAL_META_CRYPTO_KEY:-}
    healthcheck:
      test:
        [
          CMD-SHELL,
          'node -e "fetch(''http://127.0.0.1:8080/health'').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [backend]

  studio:
    image: public.ecr.aws/supabase/studio:2026.10.12-sha-3699278
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
      auth:
        condition: service_healthy
      rest:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${GARAGEM_LOCAL_DB_PASSWORD:-}
      PG_META_CRYPTO_KEY: ${GARAGEM_LOCAL_META_CRYPTO_KEY:-}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      DEFAULT_ORGANIZATION_NAME: GaragemERP
      DEFAULT_PROJECT_NAME: Local
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLIC_URL: http://127.0.0.1:${GARAGEM_LOCAL_API_PORT:-8000}
      SUPABASE_ANON_KEY: ${GARAGEM_LOCAL_ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${GARAGEM_LOCAL_SERVICE_ROLE_KEY:-}
      AUTH_JWT_SECRET: ${GARAGEM_LOCAL_JWT_SECRET:-}
      SUPABASE_PUBLISHABLE_KEY: ${GARAGEM_LOCAL_ANON_KEY:-}
      SUPABASE_SECRET_KEY: ${GARAGEM_LOCAL_SERVICE_ROLE_KEY:-}
      ENABLED_FEATURES_LOGS_ALL: "false"
    healthcheck:
      test:
        [
          CMD-SHELL,
          'node -e "fetch(''http://127.0.0.1:3000/api/platform/profile'').then((r) => { if (r.status !== 200) process.exit(1) }).catch(() => process.exit(1))"',
        ]
      timeout: 10s
      interval: 5s
      retries: 12
      start_period: 20s
    networks: [backend]

  api-gw:
    image: kong/kong:3.9.3
    restart: unless-stopped
    depends_on:
      studio:
        condition: service_healthy
    entrypoint: [/bin/sh, /home/kong/kong-entrypoint.sh]
    ports:
      - 127.0.0.1:${GARAGEM_LOCAL_API_PORT:-8000}:8000
    volumes:
      - ./compose/supabase/api/kong.yml:/home/kong/temp.yml:ro,z
      - ./compose/supabase/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro,z
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      SUPABASE_ANON_KEY: ${GARAGEM_LOCAL_ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${GARAGEM_LOCAL_SERVICE_ROLE_KEY:-}
      GARAGEM_LOCAL_APP_PORT: ${GARAGEM_LOCAL_APP_PORT:-3101}
      DASHBOARD_USERNAME: ${GARAGEM_LOCAL_DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${GARAGEM_LOCAL_DASHBOARD_PASSWORD:-}
    healthcheck:
      test: [CMD, kong, health]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [backend]

  migrations:
    image: public.ecr.aws/supabase/postgres:17.6.1.136
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    entrypoint: [/bin/sh, /scripts/apply-migrations.sh]
    environment:
      DATABASE_URL: postgres://postgres:${GARAGEM_LOCAL_DB_PASSWORD:-}@db:5432/postgres
    volumes:
      - ./scripts/selfhosted/apply-migrations.sh:/scripts/apply-migrations.sh:ro,z
      - ./supabase/migrations:/migrations:ro,z
    networks: [backend]

  app:
    image: garagem-erp:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      migrations:
        condition: service_completed_successfully
      api-gw:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      SUPABASE_URL: http://api-gw:8000
      SUPABASE_PUBLISHABLE_KEY: ${GARAGEM_LOCAL_ANON_KEY:-}
      SUPABASE_SERVICE_KEY: ${GARAGEM_LOCAL_SERVICE_ROLE_KEY:-}
      VITE_SUPABASE_URL: http://127.0.0.1:${GARAGEM_LOCAL_API_PORT:-8000}
      VITE_SUPABASE_ANON_KEY: ${GARAGEM_LOCAL_ANON_KEY:-}
    ports:
      - 127.0.0.1:${GARAGEM_LOCAL_APP_PORT:-3101}:3000
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [backend]

networks:
  backend:
    name: garagem-erp-backend

volumes:
  garagem-erp-db:
    name: garagem-erp-db
