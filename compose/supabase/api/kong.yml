# Adapted from Supabase self-hosted Docker release self-hosted/v0.8.3.
# Routes expose Auth, PostgREST, private Storage, and the locally protected Studio.
_format_version: "2.1"
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY
  - username: DASHBOARD

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

basicauth_credentials:
  - consumer: DASHBOARD
    username: "$DASHBOARD_USERNAME"
    password: "$DASHBOARD_PASSWORD"

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
        config:
          origins:
            - http://127.0.0.1:$GARAGEM_LOCAL_APP_PORT
            - http://localhost:$GARAGEM_LOCAL_APP_PORT
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
            - HEAD
          headers:
            - Accept
            - Authorization
            - Content-Type
            - apikey
            - X-Client-Info
            - X-Supabase-Api-Version
            - X-Requested-With
            - Prefer
            - Range
            - Accept-Profile
            - Content-Profile
          exposed_headers:
            - Content-Range
            - X-Total-Count
          max_age: 3600
          credentials: false
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
        config:
          origins:
            - http://127.0.0.1:$GARAGEM_LOCAL_APP_PORT
            - http://localhost:$GARAGEM_LOCAL_APP_PORT
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
            - HEAD
          headers:
            - Accept
            - Authorization
            - Content-Type
            - apikey
            - X-Client-Info
            - X-Supabase-Api-Version
            - X-Requested-With
            - Prefer
            - Range
            - Accept-Profile
            - Content-Profile
          exposed_headers:
            - Content-Range
            - X-Total-Count
          max_age: 3600
          credentials: false
      - name: key-auth
        config:
          hide_credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/
    plugins:
      - name: cors
        config:
          origins:
            - http://127.0.0.1:$GARAGEM_LOCAL_APP_PORT
            - http://localhost:$GARAGEM_LOCAL_APP_PORT
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
            - HEAD
          headers:
            - Accept
            - Authorization
            - Cache-Control
            - Content-Type
            - apikey
            - X-Client-Info
            - X-Supabase-Api-Version
            - X-Requested-With
            - X-Upsert
          exposed_headers:
            - Content-Length
            - Content-Range
            - X-Total-Count
          max_age: 3600
          credentials: false
      - name: request-transformer
        config:
          add:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"
          replace:
            headers:
              - "Authorization: $LUA_AUTH_EXPR"

  - name: studio
    url: http://studio:3000/
    routes:
      - name: studio-all
        strip_path: false
        paths:
          - /
    plugins:
      - name: basic-auth
